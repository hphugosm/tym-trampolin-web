name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tym-trampolin-astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tym-trampolin-astro/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify public site
        run: npm run check && npm run verify:site
      - name: Prepare reviewed editorial production artifact
        working-directory: .
        run: >-
          node tym-trampolin-editorial/prepare-production.mjs
          --upstream="$PWD/tym-trampolin-astro/dist"
          --public="$PWD/tym-trampolin-astro/public"
          --destination="$PWD/production-dist"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
